[project]
name = "rpl-analiz"
version = "0.1.0"
description = "Predicting whether a Russian academy footballer will break through to the RPL"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "playwright>=1.45",
    "rapidfuzz>=3.9",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "tqdm>=4.66",
    "scikit-learn>=1.5",
    "catboost>=1.2.5",
    "lifelines>=0.29",
    "shap>=0.46",
    "optuna>=3.6",
    "mlflow>=2.14",
]

[project.optional-dependencies]
# M5 extras. scikit-survival = Random Survival Forest; pycox/torch = DeepSurv (heavy)
survival = ["scikit-survival>=0.23", "pycox>=0.2.3", "torch>=2.2"]
# dashboard — M6
app = ["streamlit>=1.36"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# exploratory notebook cells: allow sys.path juggling, terse one-liners
"notebooks/*" = ["E402", "E401", "E501", "E702", "I001", "F401"]
# runnable scripts bootstrap sys.path before importing the package
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
