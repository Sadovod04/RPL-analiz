# Central configuration. Loaded via settings.load_settings().
# Thresholds here are provisional — revisit after EDA (M2).

[project]
name = "RPL-analiz"

[cohorts]
birth_year_min = 1990          # training cohort lower bound
birth_year_max = 2004          # training cohort upper bound (outcomes mostly resolved)
scoring_birth_year_min = 2005  # produced as "current prospects", NOT trained on

[target]
rpl_minutes_threshold = 200    # X: minutes in RPL (ever) to count as target = 1
settled_age = 26               # at/after this age a non-breakthrough counts as target = 0
                               # between: censored -> survival model only (M5)

[features]
cutoff_age_start = 11          # earliest age we ingest / build features from
age_buckets = ["U13", "U15", "U17", "U19", "U21"]

[scrape]
min_interval_seconds = 2.0
jitter_seconds = 1.0
max_retries = 5
backoff_factor = 2.0
user_agent = "RPL-analiz research bot (personal, non-commercial)"

[db]
# overridden by env vars (see .env.example): PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD
host = "localhost"
port = 5432
name = "rpl"
user = "rpl"
password = "rpl"

[paths]
data_raw = "data/raw"
data_processed = "data/processed"
mlruns = "mlruns"

[academies]
# universe is seeded from ЮФЛ participants at ingest time; add extra club refs here
seed_source = "youfl"
extra = []
