services:
  postgres:
    image: postgres:16
    container_name: rpl-postgres
    environment:
      POSTGRES_USER: rpl
      POSTGRES_PASSWORD: rpl
      POSTGRES_DB: rpl
    ports:
      - "5432:5432"
    volumes:
      - rpl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpl -d rpl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rpl_pgdata:
